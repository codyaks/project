<html>
    <head>
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    </head>
    <body>
      <div class="container">
        <span class="badge badge-primary">inbox</span>
        <span class="badge badge-danger">spam</span>
        <span class="badge badge-warning">Readed</span>
        <span class="badge badge-success">unreaded</span>
        <sup><span class="badge badge-info">sent</span></sup>
        <button type="button" class="btn btn-warning">Notification
            <span class="badge badge-light">20</span>
        </button>
      </div>
      <div class="container">
        <div class="progress">
            <div class="progress-bar" style="width: 70%;">70%</div>
        </div>
      </div>
    </body>
</html>
