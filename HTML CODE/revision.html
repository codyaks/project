<html>
    <head>

    </head>
    <body>
        <p id="p1"></p>
        <h5 id="h51"></h5>
        <button onclick="function1()">greeting</button>
        <script>
            function function1(){
                var greeting;
                var time=new Date().getHours();
                if(time<12){
                    greeting="good morning";
                }
                else if(time>16){
                    greeting="good evening";
                }
                else{
                    greeting="good night";
                }
                document.getElementById("p1").innerHTML="the time is "+time;
                document.getElementById("h51").innerHTML=greeting;
            }
        </script>
    </body>
</html>
