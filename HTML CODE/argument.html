    <body>
        <script>
            function functionmax(){
                var max=0;
                for(i=0;i<arguments.length;i++){
                    if(arguments[i]>max){
                        max=arguments[i];
                    }
                }
                return max;
            }
            document.write(functionmax(4,10,33,7,1,38,88,57,36,47,58));
            document.write("<br>");
            document.write(Math.random());
        </script>
    </body>
