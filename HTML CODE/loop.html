<html>
    <head>

    </head>
    <body>
        <script>
            var fruits=["Mango","banana","apple","guava","kiwi","watermelon","grapes","coconut"];
            for (i=0;i<3;i++){
                document.write(fruits[i]+"<br>"); 
             }
            var str="Akshaj is very good boy";
            document.write(str.toUpperCase()+"<br>");
            document.write(str.toLowerCase()+"<br>");
            document.write(str.startsWith("B")+"<br>");
            var pat=new RegExp("is");
            var res=pat.test(str);
            document.write(res);
        </script>
    </body>
</html>
